<!-- LID301 v10 · Gestión docente de estudiantes -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--bg:#f4f7fa;--card:#fff;--ink:#132238;--muted:#6b7b8f;--line:#dce5ed;--brand:#15537d;--brand2:#0f6f8d;--ok:#16835b;--warn:#c77a16;--bad:#bd3d3d;--shadow:0 8px 24px rgba(24,55,80,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 20px;box-shadow:var(--shadow)}
    .topbar-inner{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;font-size:20px}.brand small{display:block;font-size:12px;font-weight:500;opacity:.82;margin-top:2px}.userbox{text-align:right;font-size:13px;opacity:.95}
    .wrap{max-width:1500px;margin:18px auto;padding:0 16px 40px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px;color:var(--ink);font-weight:700}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .grid{display:grid;gap:16px}.grid.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.card h2,.card h3{margin:0 0 12px}.kpi .label{color:var(--muted);font-size:13px;font-weight:700}.kpi .value{font-size:26px;font-weight:850;margin-top:5px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
    .progress{height:10px;background:#e8eef3;border-radius:99px;overflow:hidden;margin-top:10px}.progress>span{height:100%;display:block;background:var(--ok);border-radius:99px}.progress.warn>span{background:var(--warn)}
    .presence{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.presence-status{display:flex;align-items:center;gap:10px;font-weight:800}.dot{width:12px;height:12px;border-radius:50%;background:#98a7b6}.dot.on{background:var(--ok);box-shadow:0 0 0 5px rgba(22,131,91,.12)}
    .btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;background:#edf3f7;color:var(--ink)}.btn.primary{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.danger{background:#fff1f1;color:#b42318;border:1px solid #f2b8b5}.btn.danger:hover{background:#fee4e2}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
    .formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink)}
    .schedule-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}.schedule-item{display:grid;grid-template-columns:1.2fr .8fr 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px}.muted{color:var(--muted)}.good{color:var(--ok)}.badtext{color:var(--bad)}.warntext{color:var(--warn)}
    .week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.week-nav strong{font-size:15px}
    .calendar-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.calendar{min-width:950px;display:grid;grid-template-columns:64px repeat(7,1fr);position:relative}.cal-head{height:48px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:12px;font-weight:850;background:#f8fbfd;position:sticky;top:0;z-index:2}.cal-time{height:40px;border-bottom:1px solid #edf2f6;padding:4px 7px;color:var(--muted);font-size:11px;text-align:right}.cal-day{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff 39px,#edf2f6 39px,#edf2f6 40px)}.cal-block{position:absolute;left:5px;right:5px;border-radius:8px;padding:5px 6px;background:#d7edf6;border-left:4px solid var(--brand);font-size:11px;overflow:hidden;box-shadow:0 2px 5px rgba(10,52,75,.08)}.cal-block b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-block.me{background:#dff3ea;border-left-color:var(--ok)}
    table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fbfd}.tablewrap{overflow:auto}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#edf3f7}.pill.ok{background:#def4e9;color:#116847}.pill.bad{background:#f8e1e1;color:#983232}.pill.warn{background:#fff0d9;color:#966015}
    .toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:420px;padding:13px 16px;border-radius:12px;background:#14293b;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.18)}.toast.error{background:#8f2e2e}.loader{position:fixed;inset:0;background:rgba(244,247,250,.72);z-index:100;display:flex;align-items:center;justify-content:center;font-weight:800;backdrop-filter:blur(2px)}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.setup pre{white-space:pre-wrap;word-break:break-all;background:#0f2232;color:#dbeaf2;border-radius:12px;padding:12px;font-size:12px}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
    @media(max-width:900px){.grid.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.schedule-item{grid-template-columns:1fr 1fr}.topbar-inner{align-items:flex-start}.userbox{font-size:11px}}
    @media(max-width:560px){.grid.kpis{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.schedule-item{grid-template-columns:1fr}.wrap{padding:0 10px 28px}.card{padding:14px}.brand{font-size:17px}.topbar{padding:11px 12px}.topbar-inner{flex-direction:column;align-items:stretch;gap:8px}.userbox{text-align:left}.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.tab{flex:0 0 auto}.btnrow .btn{min-height:44px}.presence{align-items:stretch}.presence>.btnrow{width:100%}.presence>.btnrow .btn{flex:1}.week-nav{align-items:stretch;flex-wrap:wrap}.week-nav .btn{flex:1}.tablewrap{-webkit-overflow-scrolling:touch}.calendar-wrap{-webkit-overflow-scrolling:touch}}
  </style>
</head>
<body>
  <div id="loader" class="loader">Cargando LID 301…</div>
  <div class="topbar"><div class="topbar-inner"><div class="brand" id="brand">LID 301<small>Control de estudiantes y asistencia</small></div><div class="userbox"><div id="userEmail"></div><div id="userRole"></div></div></div></div>
  <main class="wrap">
    <div class="tabs" id="tabs"></div>
    <section id="view-home" class="view"></section>
    <section id="view-schedule" class="view hidden"></section>
    <section id="view-history" class="view hidden"></section>
    <section id="view-admin" class="view hidden"></section>
    <section id="view-projects" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>
  <div id="toast" class="toast hidden"></div>

<script>
const INITIAL_FLASH = <?!= initialFlash ?>;
const ACCOUNT_CHOOSER_URL = <?!= accountChooserUrl ?>;
const state = { boot:null, weekStart:null, draft:[], management:null, students:[], selectedTeacher:'', selectedProject:'', managerView:'admin' };

function rpc(name, ...args){
  return new Promise((resolve,reject)=>{
    const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error((e&&e.message)||e)));
    runner[name](...args);
  });
}
function showLoading(on=true){document.getElementById('loader').classList.toggle('hidden',!on)}
function toast(msg,error=false){const el=document.getElementById('toast');el.textContent=msg;el.className='toast'+(error?' error':'');el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),4500)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtMin(n){n=Math.round(Number(n||0));return `${Math.floor(n/60)} h ${String(n%60).padStart(2,'0')} min`}
function mondayIso(d=new Date()){const x=new Date(d);x.setHours(12,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return isoDate(x)}
function isoDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function addDays(iso,n){const [y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1,d,12);x.setDate(x.getDate()+n);return isoDate(x)}
function niceDate(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return new Intl.DateTimeFormat('es-PE',{weekday:'short',day:'2-digit',month:'short'}).format(new Date(y,m-1,d,12))}
function niceTime(iso){if(!iso)return'';return new Intl.DateTimeFormat('es-PE',{hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
function fullName(s){return [s.firstName,s.lastName].filter(Boolean).join(' ')||s.name||s.email}
function timeMin(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function switchAccount(){window.top.location.href=ACCOUNT_CHOOSER_URL}
function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('Enlace copiado.')).catch(()=>prompt('Copia este enlace:',text))}

async function init(){
  try{
    state.weekStart=mondayIso();
    state.boot=await rpc('getBootstrapData',state.weekStart);
    document.getElementById('brand').firstChild.nodeValue=(state.boot.app.labName||'LID 301')+' ';
    document.getElementById('userEmail').innerHTML=`${esc(state.boot.user.email)} <button class="btn ghost" style="padding:4px 8px;margin-left:8px" onclick="switchAccount()">Cambiar cuenta</button>`;
    const roles=[]; if(state.boot.user.isAdmin)roles.push('Administrador'); if(state.boot.user.isTeacher)roles.push('Docente'); if(state.boot.user.isStudent)roles.push('Estudiante');
    document.getElementById('userRole').textContent=roles.join(' · ');
    buildTabs();
    if(state.boot.user.isStudent) renderAll();
    const first=document.querySelector('.tab'); if(first) switchView(first.dataset.view);
    if(INITIAL_FLASH) toast(INITIAL_FLASH.message,!INITIAL_FLASH.success);
  }catch(e){
    document.querySelector('.wrap').innerHTML=`<div class="card" style="max-width:680px;margin:50px auto"><h2>No se pudo abrir el sistema</h2><p>${esc(e.message)}</p><p class="muted">Selecciona explícitamente la cuenta UPCH que deseas utilizar.</p><div class="btnrow"><button class="btn primary" onclick="switchAccount()">Elegir / cambiar cuenta UPCH</button></div></div>`;
    document.getElementById('userEmail').innerHTML=`<button class="btn ghost" onclick="switchAccount()">Elegir cuenta UPCH</button>`;
  } finally{showLoading(false)}
}

function buildTabs(){
  const tabs=[];
  if(state.boot.user.isStudent) tabs.push(['home','Inicio'],['schedule','Mi horario'],['history','Historial']);
  if(state.boot.user.isAdmin||state.boot.user.isTeacher){ tabs.push(['admin',state.boot.user.isAdmin?'Administración':'Mis estudiantes']); tabs.push(['projects','Proyectos']); }
  if(state.boot.user.isAdmin) tabs.push(['settings','Configuración']);
  const host=document.getElementById('tabs');host.innerHTML=tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-view="${t[0]}">${t[1]}</button>`).join('');
  host.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
}
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  const view=document.getElementById('view-'+name); if(view)view.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  if(name==='admin')loadManagement('admin'); if(name==='projects')loadManagement('projects'); if(name==='settings')renderSettings();
}
function renderAll(){if(!state.boot.mine)return;renderHome();renderSchedule();renderHistory()}

function renderHome(){
  const m=state.boot.mine,min=m.minimumMinutes,pct=Math.min(100,Math.round(m.validMinutes/min*100));
  document.getElementById('view-home').innerHTML=`
    <div class="grid kpis"><div class="card kpi"><div class="label">Horas válidas esta semana</div><div class="value">${fmtMin(m.validMinutes)}</div><div class="progress ${m.validMinutes<min?'warn':''}"><span style="width:${pct}%"></span></div><div class="sub">Mínimo ${fmtMin(min)}</div></div><div class="card kpi"><div class="label">Horas programadas</div><div class="value">${fmtMin(m.plannedMinutes)}</div><div class="sub">${m.plannedMinutes>=min?'Horario mínimo cubierto':'Aún faltan horas por programar'}</div></div><div class="card kpi"><div class="label">Cumplimiento</div><div class="value ${m.validMinutes>=min?'good':'warntext'}">${m.validMinutes>=min?'CUMPLE':'PENDIENTE'}</div><div class="sub">${m.validMinutes>=min?'Semana completada':'Faltan '+fmtMin(Math.max(0,min-m.validMinutes))}</div></div><div class="card kpi"><div class="label">Estado actual</div><div class="value ${m.openSession?'good':''}">${m.openSession?'DENTRO':'FUERA'}</div><div class="sub">${m.openSession?'Entrada '+niceTime(m.openSession.entry):'Sin sesión abierta'}</div></div></div>
    <div class="card" style="margin-top:16px"><div class="presence"><div><h3>Presencia en LID 301</h3><div class="presence-status"><span class="dot ${m.openSession?'on':''}"></span>${m.openSession?'Estás registrado dentro del laboratorio':'No tienes una sesión abierta'}</div><p class="muted">La Raspberry validará que el dispositivo esté físicamente conectado a la red local del laboratorio.</p></div><div class="btnrow"><button class="btn ok" onclick="presence('ENTRY')" ${m.openSession?'disabled':''}>Marcar entrada</button><button class="btn bad" onclick="presence('EXIT')" ${!m.openSession?'disabled':''}>Marcar salida</button></div></div></div>`;
}
async function presence(action){showLoading(true);try{const x=await rpc('createPresenceChallenge',action);window.top.location.href=x.url}catch(e){toast(e.message,true);showLoading(false)}}

function renderSchedule(){
  const m=state.boot.mine;state.weekStart=m.weekStart;state.draft=m.schedule.map(x=>({date:x.date,start:x.start,end:x.end,note:x.note||''}));
  document.getElementById('view-schedule').innerHTML=`<div class="card"><div class="week-nav"><button class="btn ghost" onclick="changeStudentWeek(-7)">←</button><strong id="schedWeekLabel"></strong><button class="btn ghost" onclick="changeStudentWeek(7)">→</button></div><h3>Programar mis horas</h3><p class="muted">Debes programar como mínimo ${fmtMin(state.boot.mine.minimumMinutes)} durante la semana.</p><div class="formgrid"><div class="field"><label>Fecha</label><input id="blkDate" type="date"></div><div class="field"><label>Inicio</label><input id="blkStart" type="time" value="09:00"></div><div class="field"><label>Fin</label><input id="blkEnd" type="time" value="11:00"></div><div class="field" style="align-self:end"><button class="btn primary" style="width:100%" onclick="addDraftBlock()">Agregar bloque</button></div></div><div class="schedule-list" id="draftList"></div><div class="section-title"><strong id="draftTotal"></strong><div class="btnrow"><button class="btn ghost" onclick="copyPrevious()">Copiar semana anterior</button><button class="btn primary" onclick="saveDraft()">Guardar horario</button></div></div></div><div class="card" style="margin-top:16px"><h3>Vista semanal</h3><div id="draftCalendar"></div></div>`;refreshDraft();
}
async function changeStudentWeek(days){showLoading(true);try{state.weekStart=addDays(state.weekStart,days);state.boot.mine=await rpc('getMyDashboard',state.weekStart);renderAll();switchView('schedule')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
function addDraftBlock(){const date=document.getElementById('blkDate').value,start=document.getElementById('blkStart').value,end=document.getElementById('blkEnd').value;if(!date||!start||!end)return toast('Completa fecha, inicio y fin.',true);if(date<state.weekStart||date>addDays(state.weekStart,6))return toast('La fecha debe pertenecer a la semana seleccionada.',true);if(timeMin(end)<=timeMin(start))return toast('La hora de fin debe ser posterior.',true);state.draft.push({date,start,end,note:''});state.draft.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));refreshDraft()}
function removeDraft(i){state.draft.splice(i,1);refreshDraft()}
function refreshDraft(){const min=state.draft.reduce((a,b)=>a+Math.max(0,timeMin(b.end)-timeMin(b.start)),0);document.getElementById('schedWeekLabel').textContent=`${niceDate(state.weekStart)} – ${niceDate(addDays(state.weekStart,6))}`;document.getElementById('blkDate').min=state.weekStart;document.getElementById('blkDate').max=addDays(state.weekStart,6);if(!document.getElementById('blkDate').value)document.getElementById('blkDate').value=state.weekStart;document.getElementById('draftList').innerHTML=state.draft.length?state.draft.map((b,i)=>`<div class="schedule-item"><b>${niceDate(b.date)}</b><span>${esc(b.start)}–${esc(b.end)}</span><span class="muted">${fmtMin(timeMin(b.end)-timeMin(b.start))}</span><button class="btn bad" onclick="removeDraft(${i})">Quitar</button></div>`).join(''):'<div class="empty">Aún no agregaste bloques.</div>';document.getElementById('draftTotal').textContent='Total programado: '+fmtMin(min);document.getElementById('draftTotal').className=min>=state.boot.mine.minimumMinutes?'good':'warntext';document.getElementById('draftCalendar').innerHTML=calendarHtml(state.draft.map((b,i)=>({...b,email:state.boot.user.email,id:String(i),minutes:timeMin(b.end)-timeMin(b.start)})),true)}
async function saveDraft(){showLoading(true);try{state.boot.mine=await rpc('saveMySchedule',state.weekStart,state.draft);toast('Horario guardado correctamente.');renderAll();switchView('schedule')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
async function copyPrevious(){showLoading(true);try{state.boot.mine=await rpc('copyPreviousWeek',state.weekStart);toast('Horario de la semana anterior copiado.');renderAll();switchView('schedule')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
function renderHistory(){const rows=[...state.boot.mine.attendance].sort((a,b)=>(b.entry||'').localeCompare(a.entry||''));document.getElementById('view-history').innerHTML=`<div class="card"><h3>Mis asistencias · ${niceDate(state.boot.mine.weekStart)} – ${niceDate(state.boot.mine.weekEnd)}</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Bruto</th><th>Válido</th><th>Estado</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${niceTime(r.entry)}</td><td>${r.exit?niceTime(r.exit):'—'}</td><td>${fmtMin(r.rawMinutes)}</td><td><b>${fmtMin(r.validMinutes)}</b></td><td><span class="pill ${r.status==='ABIERTA'?'warn':r.status==='INVALIDA'?'bad':'ok'}">${esc(r.status)}</span></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Sin asistencias esta semana.</td></tr>'}</tbody></table></div></div>`}

function calendarHtml(blocks,isMine=false){
  const start=state.boot.app.calendarStartHour,end=state.boot.app.calendarEndHour,h=(end-start)*40;const days=[0,1,2,3,4,5,6].map(i=>addDays(state.weekStart,i));
  let html='<div class="calendar-wrap"><div class="calendar"><div class="cal-head"></div>'+days.map(d=>`<div class="cal-head">${niceDate(d)}</div>`).join('');
  html+='<div>'+Array.from({length:end-start},(_,i)=>`<div class="cal-time">${String(start+i).padStart(2,'0')}:00</div>`).join('')+'</div>';
  days.forEach(d=>{const dayBlocks=blocks.filter(b=>b.date===d);html+=`<div class="cal-day" style="height:${h}px">`;dayBlocks.forEach(b=>{const s=timeMin(b.start),e=timeMin(b.end),top=(s-start*60)/60*40,height=Math.max(20,(e-s)/60*40);if(e<=start*60||s>=end*60)return;const st=state.students.find(x=>x.email===b.email);const person=isMine?'':(st?fullName(st):b.email);html+=`<div class="cal-block ${isMine?'me':''}" style="top:${Math.max(0,top)}px;height:${height}px"><b>${esc(person||`${b.start}–${b.end}`)}</b>${esc(`${b.start}–${b.end}`)}</div>`});html+='</div>'});return html+'</div></div>'
}

async function loadManagement(view){
  if(view==='admin'||view==='projects') state.managerView=view;
  showLoading(true);
  try{
    state.management=await rpc('getAdminWeek',state.weekStart,state.selectedTeacher,state.selectedProject);
    state.students=state.management.students;
    if(state.managerView==='projects') renderProjects();
    else renderManagement();
  }catch(e){toast(e.message,true)}finally{showLoading(false)}
}
function teacherOptions(selected=''){
  const ts=(state.management?.teachers||[]).filter(t=>t.status==='ACTIVO');
  return `<option value="">Seleccione docente</option>`+ts.map(t=>`<option value="${esc(t.email)}" ${t.email===selected?'selected':''}>${esc(t.email)} — ${esc(t.name)}</option>`).join('');
}
function projectOptions(selected='',teacherEmail=''){
  if(!teacherEmail)return '<option value="">Seleccione primero un docente</option>';
  const ps=(state.management?.projects||[]).filter(p=>p.status==='ACTIVO'&&p.teacherEmail===teacherEmail);
  return `<option value="">Sin proyecto asignado</option>`+ps.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.alias)} — ${esc(p.sidisi)}</option>`).join('');
}
function projectLabel(p){return p?`${p.alias} — ${p.sidisi}`:'—'}
function studentProjectLabel(s){const p=(state.management?.projects||[]).find(x=>x.id===s.projectId);return p?projectLabel(p):'—'}

function renderManagement(){
  const a=state.management;if(!a)return;const admin=a.viewer.isAdmin,present=a.open;
  const filterProjects=a.projects.filter(p=>p.status==='ACTIVO'&&(!a.selectedTeacherEmail||p.teacherEmail===a.selectedTeacherEmail));
  const teacherFilter=admin?`<div class="field" style="min-width:310px"><label>Filtrar por docente</label><select id="teacherFilter" onchange="setTeacherFilter(this.value)"><option value="">Todos los docentes</option>${a.teachers.filter(t=>t.status==='ACTIVO').map(t=>`<option value="${esc(t.email)}" ${a.selectedTeacherEmail===t.email?'selected':''}>${esc(t.email)} — ${esc(t.name)}</option>`).join('')}</select></div>`:'';
  const projectFilter=`<div class="field" style="min-width:280px"><label>Filtrar por proyecto</label><select id="projectFilter" onchange="setProjectFilter(this.value)"><option value="">Todos los proyectos</option>${filterProjects.map(p=>`<option value="${esc(p.id)}" ${a.selectedProjectId===p.id?'selected':''}>${esc(p.alias)} — ${esc(p.sidisi)}</option>`).join('')}</select></div>`;
  const filters=`<div style="display:flex;gap:10px;flex-wrap:wrap">${teacherFilter}${projectFilter}</div>`;

  const teacherSummary=admin?`<div class="card" style="margin-top:16px"><h3>Comportamiento por docente</h3><div class="tablewrap"><table><thead><tr><th>Docente</th><th>Estudiantes</th><th>Cumplen</th><th>Programado total</th><th>Horas válidas</th></tr></thead><tbody>${a.teacherSummary.length?a.teacherSummary.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="muted">${esc(t.email)}</div></td><td>${t.studentCount}</td><td>${t.compliantCount}</td><td>${fmtMin(t.plannedMinutes)}</td><td>${fmtMin(t.validMinutes)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aún no hay docentes registrados.</td></tr>'}</tbody></table></div></div>`:'';

  const studentTeacherField=admin
    ? `<div class="field"><label>Docente a cargo</label><select id="stTeacher" onchange="updateStudentProjectOptions()">${teacherOptions()}</select></div>`
    : `<div class="field"><label>Docente a cargo</label><input value="${esc(a.viewer.email)}" disabled></div>`;

  const studentForm=`<div class="card"><h3>Agregar / editar estudiante</h3><div class="formgrid"><div class="field"><label>Correo UPCH</label><input id="stEmail" placeholder="alumno@upch.pe"></div>${studentTeacherField}<div class="field"><label>Nombres</label><input id="stFirst"></div><div class="field"><label>Apellidos</label><input id="stLast"></div><div class="field"><label>Carrera</label><input id="stCareer"></div><div class="field"><label>Proyecto</label><select id="stProject">${projectOptions('',admin?'':a.viewer.email)}</select></div><div class="field"><label>Estado</label><select id="stStatus"><option>ACTIVO</option><option>INACTIVO</option></select></div><div class="field"><label>Horas mín./semana</label><input id="stMin" type="number" step="0.5" value="5"></div></div><div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="saveStudent()">Guardar estudiante</button><button class="btn ghost" onclick="clearStudentForm()">Limpiar</button></div></div>`;

  const teacherForm=admin?`<div class="card"><h3>Agregar / editar docente</h3><div class="formgrid"><div class="field"><label>Nombre completo</label><input id="tcName"></div><div class="field"><label>Correo UPCH</label><input id="tcEmail" placeholder="docente@upch.pe"></div><div class="field"><label>Celular (opcional)</label><input id="tcPhone"></div><div class="field"><label>Estado</label><select id="tcStatus"><option>ACTIVO</option><option>INACTIVO</option></select></div></div><div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="saveTeacher()">Guardar docente</button></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Docente</th><th>Celular</th><th>Estado</th><th></th></tr></thead><tbody>${a.teachers.map((t,i)=>`<tr><td><b>${esc(t.name)}</b><div class="muted">${esc(t.email)}</div></td><td>${esc(t.phone||'—')}</td><td><span class="pill ${t.status==='ACTIVO'?'ok':'bad'}">${esc(t.status)}</span></td><td><div class="btnrow"><button class="btn ghost" onclick="editTeacher(${i})">Editar</button><button class="btn danger" onclick="deleteTeacher(${i})">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div></div>`:'';

  const adminForms=`<div class="split" style="margin-top:16px">${studentForm}${teacherForm}</div>`;

  const projectTeacherField=admin?`<div class="field"><label>Docente responsable</label><select id="prTeacher">${teacherOptions()}</select></div>`:`<div class="field"><label>Docente responsable</label><input value="${esc(a.viewer.email)}" disabled></div>`;
  const projectRows=a.projects.length?a.projects.map((p,i)=>`<tr><td><b>${esc(p.alias)}</b><div class="muted">${esc(p.title)}</div></td><td>${esc(p.sidisi)}</td><td>${esc(p.teacherEmail)}</td><td>${p.financed==='SI'?`Sí<div class="muted">${esc(p.funder)} · ${esc(p.amount)}</div>`:'No'}</td><td><div class="btnrow"><button class="btn ghost" onclick="editProject(${i})">Editar</button><button class="btn danger" onclick="deleteProject(${i})">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aún no hay proyectos registrados.</td></tr>';
  const projectCard=`<div class="card" style="margin-top:16px"><div class="section-title"><div><h3>Proyectos</h3><div class="muted">Formulario breve para registrar los proyectos del laboratorio.</div></div></div><input id="prId" type="hidden"><div class="formgrid">${projectTeacherField}<div class="field"><label>Código SIDISI</label><input id="prSidisi" placeholder="Código SIDISI"><label style="margin-top:7px;font-weight:600"><input id="prSidisiPending" type="checkbox" onchange="toggleSidisiPending()" style="width:auto;margin-right:5px">Por registrar</label></div><div class="field" style="grid-column:span 2"><label>Título completo</label><input id="prTitle" placeholder="Título completo del proyecto"></div><div class="field"><label>Alias</label><input id="prAlias" placeholder="Nombre corto"></div><div class="field"><label>¿Financiado?</label><select id="prFinanced" onchange="toggleFundingFields()"><option value="NO">No</option><option value="SI">Sí</option></select></div><div class="field hidden" id="prFunderField"><label>Financiador</label><input id="prFunder" placeholder="Entidad financiadora"></div><div class="field hidden" id="prAmountField"><label>Monto</label><input id="prAmount" placeholder="Ej. S/ 80 000 o USD 25 000"></div></div><div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="saveProject()">Guardar proyecto</button><button class="btn ghost" onclick="clearProjectForm()">Limpiar</button></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Proyecto</th><th>SIDISI</th><th>Docente</th><th>Financiamiento</th><th></th></tr></thead><tbody>${projectRows}</tbody></table></div></div>`;

  document.getElementById('view-admin').innerHTML=`
    <div class="card"><div class="section-title"><div><h2>${admin?'Panel del laboratorio':'Mis estudiantes'}</h2><div class="muted">${admin?'Vista general por docente y proyecto':'Solo se muestran tus estudiantes y tus proyectos'}</div></div>${filters}</div></div>
    <div class="grid kpis" style="margin-top:16px"><div class="card kpi"><div class="label">Estudiantes activos</div><div class="value">${a.summary.length}</div></div><div class="card kpi"><div class="label">Dentro ahora</div><div class="value good">${present.length}</div></div><div class="card kpi"><div class="label">Cumplen mínimo</div><div class="value">${a.summary.filter(x=>x.validMinutes>=x.minimumMinutes).length}</div></div><div class="card kpi"><div class="label">Horario mínimo programado</div><div class="value">${a.summary.filter(x=>x.plannedMinutes>=x.minimumMinutes).length}</div></div></div>
    ${teacherSummary}${adminForms}
    <div class="card" style="margin-top:16px"><div class="week-nav"><button class="btn ghost" onclick="changeManagementWeek(-7)">←</button><strong>${niceDate(a.weekStart)} – ${niceDate(addDays(a.weekStart,6))}</strong><button class="btn ghost" onclick="changeManagementWeek(7)">→</button></div><h3>Horario semanal</h3>${calendarHtml(a.schedules.filter(x=>x.status==='CONFIRMADO'),false)}</div>
    <div class="split" style="margin-top:16px"><div class="card"><div class="section-title"><h3>Presentes ahora</h3><button class="btn ghost" onclick="loadManagement('admin')">Actualizar</button></div>${present.length?present.map(p=>`<div class="schedule-item"><b>${esc((state.students.find(s=>s.email===p.email)&&fullName(state.students.find(s=>s.email===p.email)))||p.email)}</b><span>${niceTime(p.entry)}</span><span class="pill ok">DENTRO</span><span></span></div>`).join(''):'<div class="empty">No hay sesiones abiertas.</div>'}</div><div class="card"><h3>Cumplimiento semanal</h3><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Docente</th><th>Proyecto</th><th>Programado</th><th>Válido</th><th>Estado</th></tr></thead><tbody>${a.summary.length?a.summary.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(s.email)}</div></td><td>${esc(s.teacherEmail||'—')}</td><td>${esc(s.projectAlias||'—')}</td><td>${fmtMin(s.plannedMinutes)}</td><td><b>${fmtMin(s.validMinutes)}</b></td><td><span class="pill ${s.validMinutes>=s.minimumMinutes?'ok':'bad'}">${s.validMinutes>=s.minimumMinutes?'CUMPLE':'PENDIENTE'}</span></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Sin estudiantes en esta vista.</td></tr>'}</tbody></table></div></div></div>
    <div class="card" style="margin-top:16px"><h3>Estudiantes</h3><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Docente a cargo</th><th>Proyecto</th><th>Estado</th><th>Horas mín.</th><th></th></tr></thead><tbody>${a.students.map((s,i)=>`<tr><td>${esc(fullName(s))}</td><td>${esc(s.email)}</td><td>${esc(s.teacherEmail||'—')}</td><td>${esc(studentProjectLabel(s))}</td><td><span class="pill ${s.status==='ACTIVO'?'ok':'bad'}">${esc(s.status)}</span></td><td>${esc(s.minHours)}</td><td><div class="btnrow"><button class="btn ghost" onclick="editStudent(${i})">Editar</button>${admin?`<button class="btn danger" onclick="deleteStudent(${i})">Eliminar</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card" style="margin-top:16px"><h3>Asistencias de la semana</h3><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Entrada</th><th>Salida</th><th>Válido</th><th>Estado</th>${admin?'<th></th>':''}</tr></thead><tbody>${a.attendance.length?a.attendance.sort((x,y)=>(y.entry||'').localeCompare(x.entry||'')).map(r=>`<tr><td>${esc((state.students.find(s=>s.email===r.email)&&fullName(state.students.find(s=>s.email===r.email)))||r.email)}</td><td>${r.entry?new Date(r.entry).toLocaleString('es-PE'):''}</td><td>${r.exit?new Date(r.exit).toLocaleString('es-PE'):'—'}</td><td>${fmtMin(r.validMinutes)}</td><td>${esc(r.status)}</td>${admin?`<td>${r.exit?`<button class="btn ghost" onclick="correctAttendance('${esc(r.id)}','${esc(r.entry)}','${esc(r.exit)}')">Corregir</button>`:''}</td>`:''}</tr>`).join(''):`<tr><td colspan="${admin?6:5}" class="muted">Sin registros.</td></tr>`}</tbody></table></div></div>`;
  toggleFundingFields();
}
function renderProjects(){
  const a=state.management;if(!a)return;const admin=a.viewer.isAdmin;
  const projectTeacherField=admin?`<div class="field"><label>Docente responsable</label><select id="prTeacher">${teacherOptions()}</select></div>`:`<div class="field"><label>Docente responsable</label><input value="${esc(a.viewer.email)}" disabled></div>`;
  const projectRows=a.projects.length?a.projects.map((p,i)=>`<tr><td><b>${esc(p.alias)}</b><div class="muted">${esc(p.title)}</div></td><td>${esc(p.sidisi)}</td><td>${esc(p.teacherEmail)}</td><td>${p.financed==='SI'?`Sí<div class="muted">${esc(p.funder)} · ${esc(p.amount)}</div>`:'No'}</td><td><div class="btnrow"><button class="btn ghost" onclick="editProject(${i})">Editar</button><button class="btn danger" onclick="deleteProject(${i})">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aún no hay proyectos registrados.</td></tr>';
  document.getElementById('view-projects').innerHTML=`<div class="card"><div class="section-title"><div><h2>Proyectos</h2><div class="muted">Registra y administra los proyectos del laboratorio.</div></div></div><input id="prId" type="hidden"><div class="formgrid">${projectTeacherField}<div class="field"><label>Código SIDISI</label><input id="prSidisi" placeholder="Código SIDISI"><label style="margin-top:7px;font-weight:600"><input id="prSidisiPending" type="checkbox" onchange="toggleSidisiPending()" style="width:auto;margin-right:5px">Por registrar</label></div><div class="field" style="grid-column:span 2"><label>Título completo</label><input id="prTitle" placeholder="Título completo del proyecto"></div><div class="field"><label>Alias</label><input id="prAlias" placeholder="Nombre corto"></div><div class="field"><label>¿Financiado?</label><select id="prFinanced" onchange="toggleFundingFields()"><option value="NO">No</option><option value="SI">Sí</option></select></div><div class="field hidden" id="prFunderField"><label>Financiador</label><input id="prFunder" placeholder="Entidad financiadora"></div><div class="field hidden" id="prAmountField"><label>Monto</label><input id="prAmount" placeholder="Ej. S/ 80 000 o USD 25 000"></div></div><div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="saveProject()">Guardar proyecto</button><button class="btn ghost" onclick="clearProjectForm()">Limpiar</button></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Proyecto</th><th>SIDISI</th><th>Docente</th><th>Financiamiento</th><th></th></tr></thead><tbody>${projectRows}</tbody></table></div></div>`;
  if(admin && a.viewer.isTeacher){const t=document.getElementById('prTeacher');if(t&&!t.value)t.value=a.viewer.email;}
  toggleSidisiPending();toggleFundingFields();
}
function setTeacherFilter(v){state.selectedTeacher=v;state.selectedProject='';loadManagement('admin')}
function setProjectFilter(v){state.selectedProject=v;loadManagement('admin')}
async function changeManagementWeek(days){state.weekStart=addDays(state.weekStart,days);await loadManagement('admin')}
function updateStudentProjectOptions(selected=''){const teacher=state.management.viewer.isAdmin?(document.getElementById('stTeacher')?.value||''):state.management.viewer.email;const el=document.getElementById('stProject');if(el)el.innerHTML=projectOptions(selected,teacher)}
function clearStudentForm(){['stEmail','stFirst','stLast','stCareer'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});const email=document.getElementById('stEmail');if(email)email.readOnly=false;if(state.management.viewer.isAdmin){const t=document.getElementById('stTeacher');if(t)t.value=''}const p=document.getElementById('stProject');if(p)p.innerHTML=projectOptions('',state.management.viewer.isAdmin?'':state.management.viewer.email);const s=document.getElementById('stStatus');if(s)s.value='ACTIVO';const m=document.getElementById('stMin');if(m)m.value='5'}
function editStudent(i){const s=state.management.students[i];if(!s)return;const email=document.getElementById('stEmail');email.value=s.email;email.readOnly=true;if(state.management.viewer.isAdmin){document.getElementById('stTeacher').innerHTML=teacherOptions(s.teacherEmail);document.getElementById('stTeacher').value=s.teacherEmail||''}updateStudentProjectOptions(s.projectId||'');document.getElementById('stFirst').value=s.firstName||'';document.getElementById('stLast').value=s.lastName||'';document.getElementById('stCareer').value=s.career||'';document.getElementById('stStatus').value=s.status;document.getElementById('stMin').value=s.minHours;document.getElementById('stEmail').scrollIntoView({behavior:'smooth'})}
async function saveStudent(){const teacherEmail=state.management.viewer.isAdmin?(document.getElementById('stTeacher')?.value||''):state.management.viewer.email;const s={email:document.getElementById('stEmail').value,teacherEmail,firstName:document.getElementById('stFirst').value,lastName:document.getElementById('stLast').value,career:document.getElementById('stCareer').value,projectId:document.getElementById('stProject').value,status:document.getElementById('stStatus').value,minHours:document.getElementById('stMin').value};showLoading(true);try{await rpc('managerUpsertStudent',s);toast('Estudiante guardado.');clearStudentForm();await loadManagement()}catch(e){toast(e.message,true)}finally{showLoading(false)}}
function editTeacher(i){const t=state.management.teachers[i];document.getElementById('tcName').value=t.name||'';document.getElementById('tcEmail').value=t.email||'';document.getElementById('tcPhone').value=t.phone||'';document.getElementById('tcStatus').value=t.status;document.getElementById('tcName').scrollIntoView({behavior:'smooth'})}
async function saveTeacher(){const t={name:document.getElementById('tcName').value,email:document.getElementById('tcEmail').value,phone:document.getElementById('tcPhone').value,status:document.getElementById('tcStatus').value};showLoading(true);try{await rpc('adminUpsertTeacher',t);toast('Docente guardado.');await loadManagement('admin')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
function toggleSidisiPending(){const c=document.getElementById('prSidisiPending'),i=document.getElementById('prSidisi');if(i)i.disabled=!!(c&&c.checked)}
function toggleFundingFields(){const yes=document.getElementById('prFinanced')?.value==='SI';document.getElementById('prFunderField')?.classList.toggle('hidden',!yes);document.getElementById('prAmountField')?.classList.toggle('hidden',!yes)}
function clearProjectForm(){const ids=['prId','prSidisi','prTitle','prAlias','prFunder','prAmount'];ids.forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});const p=document.getElementById('prSidisiPending');if(p)p.checked=false;const f=document.getElementById('prFinanced');if(f)f.value='NO';if(state.management.viewer.isAdmin){const t=document.getElementById('prTeacher');if(t)t.value=state.management.viewer.isTeacher?state.management.viewer.email:''}toggleSidisiPending();toggleFundingFields()}
function editProject(i){const p=state.management.projects[i];if(!p)return;document.getElementById('prId').value=p.id;const pending=p.sidisi==='POR REGISTRAR';document.getElementById('prSidisi').value=pending?'':p.sidisi;document.getElementById('prSidisiPending').checked=pending;document.getElementById('prTitle').value=p.title||'';document.getElementById('prAlias').value=p.alias||'';document.getElementById('prFinanced').value=p.financed||'NO';document.getElementById('prFunder').value=p.funder||'';document.getElementById('prAmount').value=p.amount||'';if(state.management.viewer.isAdmin)document.getElementById('prTeacher').value=p.teacherEmail||'';toggleSidisiPending();toggleFundingFields();document.getElementById('prTitle').scrollIntoView({behavior:'smooth'})}
async function saveProject(){const p={id:document.getElementById('prId').value,sidisi:document.getElementById('prSidisi').value,pendingSidisi:document.getElementById('prSidisiPending').checked,title:document.getElementById('prTitle').value,alias:document.getElementById('prAlias').value,financed:document.getElementById('prFinanced').value,funder:document.getElementById('prFunder').value,amount:document.getElementById('prAmount').value,teacherEmail:state.management.viewer.isAdmin?document.getElementById('prTeacher').value:state.management.viewer.email};showLoading(true);try{await rpc('managerUpsertProject',p);toast('Proyecto guardado.');await loadManagement('projects')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
async function deleteProject(i){const p=state.management.projects[i];if(!p)return;const ok=confirm(`¿Eliminar el proyecto ${p.alias} (${p.sidisi})?\n\nSolo se permitirá si no tiene estudiantes asignados. El historial de auditoría se conservará.`);if(!ok)return;showLoading(true);try{await rpc('managerDeleteProject',p.id);toast('Proyecto eliminado.');await loadManagement('projects')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
async function deleteStudent(i){const s=state.management.students[i];if(!s)return;const ok=confirm(`¿Eliminar a ${fullName(s)} (${s.email})?\n\nPerderá acceso al sistema y dejará de aparecer en los listados activos. Su historial de horarios, asistencias y auditoría se conservará.`);if(!ok)return;showLoading(true);try{await rpc('adminDeleteStudent',s.email);toast('Estudiante eliminado.');await loadManagement('admin')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
async function deleteTeacher(i){const t=state.management.teachers[i];if(!t)return;const ok=confirm(`¿Eliminar al docente ${t.name} (${t.email})?\n\nSolo se permitirá si ya no tiene estudiantes ni proyectos asignados. El historial existente se conservará.`);if(!ok)return;showLoading(true);try{await rpc('adminDeleteTeacher',t.email);toast('Docente eliminado.');await loadManagement('admin')}catch(e){toast(e.message,true)}finally{showLoading(false)}}
async function correctAttendance(id,entry,exit){const a=prompt('Entrada (ISO)',entry);if(!a)return;const b=prompt('Salida (ISO)',exit);if(!b)return;const note=prompt('Motivo de la corrección','Corrección administrativa')||'';showLoading(true);try{await rpc('adminCorrectAttendance',id,a,b,note);toast('Asistencia corregida.');await loadManagement('admin')}catch(e){toast(e.message,true)}finally{showLoading(false)}}


async function renderSettings(){
  const publicUrl=(state.boot&&state.boot.app&&state.boot.app.publicFrontendUrl)||'https://ulewis.github.io/Control_301_LID';
  document.getElementById('view-settings').innerHTML=`<div class="card"><h3>Acceso al sistema</h3><p class="muted">Comparte únicamente este enlace oficial de acceso al LID 301.</p><div class="field"><label>Enlace oficial de acceso</label><input id="accessUrl" readonly value="${esc(publicUrl)}"></div><div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="copyText('${esc(publicUrl)}')">Copiar enlace</button><button class="btn ghost" onclick="switchAccount()">Cambiar / probar cuenta</button></div></div><div class="card setup" style="margin-top:16px"><h3>Configuración Raspberry Pi</h3><p class="muted">Estos datos son sensibles. Úsalos solamente para configurar la Raspberry del LID 301.</p><button class="btn primary" id="loadSetup">Mostrar configuración</button><div id="setupBox"></div></div>`;
  document.getElementById('loadSetup').onclick=loadSetupBox;
}
async function loadSetupBox(){showLoading(true);try{const s=await rpc('getRaspberrySetup');document.getElementById('setupBox').innerHTML=`<pre>ACCESS_URL=${esc(s.accountChooserUrl)}\nWEB_APP_URL=${esc(s.webAppUrl)}\nSHARED_SECRET=${esc(s.sharedSecret)}\nDEVICE_ID=${esc(s.deviceId)}\nALLOWED_SUBNETS=${esc(s.allowedSubnetHint)}\nINTERFACE=${esc(s.interfaceName)}\nRPI_BASE_URL=${esc(s.raspberryBaseUrl)}</pre><div class="formgrid"><div class="field" style="grid-column:1/-1"><label>URL local de la Raspberry</label><input id="rpiUrlEdit" value="${esc(s.raspberryBaseUrl)}"></div></div><div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="saveRpiUrl()">Guardar URL de Raspberry</button></div><p class="muted">Comparte ACCESS_URL con estudiantes y docentes. WEB_APP_URL se mantiene como URL técnica interna para la Raspberry.</p>`}catch(e){toast(e.message,true)}finally{showLoading(false)}}
async function saveRpiUrl(){showLoading(true);try{await rpc('adminUpdateRaspberryBaseUrl',document.getElementById('rpiUrlEdit').value);toast('URL de Raspberry actualizada.');await loadSetupBox()}catch(e){toast(e.message,true)}finally{showLoading(false)}}

init();
</script>

</body>
</html>
