<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15537d">
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbyKWiY6tKp4JMa9y__6HcZItW7bNPu2YJX0TkqsQiBm5vSllwBVrB7g0YoxFK5Qv-7Z5g/exec">
  <title>LID 301</title>
  <style>
    :root{--b:#15537d;--b2:#0e6d91;--i:#183449;--m:#667b8b;--bg:#f3f7fa;--c:#fff;--l:#dce7ed;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--i)}
    body{min-height:100dvh;display:grid;place-items:center;padding:18px}
    .card{width:min(460px,100%);background:var(--c);border:1px solid var(--l);border-radius:20px;padding:28px;box-shadow:0 14px 42px rgba(24,52,73,.10);text-align:center}
    .logo{width:68px;height:68px;border-radius:19px;background:linear-gradient(135deg,var(--b),var(--b2));display:grid;place-items:center;margin:0 auto 18px;color:#fff;font-size:22px;font-weight:900}
    h1{margin:0 0 8px;font-size:23px}
    p{margin:0;color:var(--m);font-size:14px;line-height:1.5}
    .btn{margin-top:18px;display:flex;align-items:center;justify-content:center;min-height:46px;padding:12px 18px;border-radius:11px;background:var(--b);color:#fff;text-decoration:none;font-weight:800;font-size:14px}
    @media(max-width:650px){.card{padding:22px 16px;border-radius:17px}.logo{width:61px;height:61px;border-radius:17px}h1{font-size:21px}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">301</div>
    <h1>Abriendo LID 301</h1>
    <p>Si no eres redirigido automáticamente, usa el botón.</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbyKWiY6tKp4JMa9y__6HcZItW7bNPu2YJX0TkqsQiBm5vSllwBVrB7g0YoxFK5Qv-7Z5g/exec">Abrir LID 301</a>
  </main>
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbyKWiY6tKp4JMa9y__6HcZItW7bNPu2YJX0TkqsQiBm5vSllwBVrB7g0YoxFK5Qv-7Z5g/exec");
  </script>
</body>
</html>
